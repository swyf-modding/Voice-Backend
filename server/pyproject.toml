[project]
name = "scamwyf-voice-backend"
version = "0.1.0"
description = "Local Parakeet ASR and Chatterbox TTS endpoints for ScamWYF.VoiceBackend"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "numpy>=1.26",
    "soundfile>=0.12",
    "librosa>=0.10",
    "onnx-asr[cpu,hub]>=0.6.0",
]

[project.optional-dependencies]
tts = [
    "chatterbox-tts>=0.1.2",
    "torch>=2.2",
    "torchaudio>=2.2",
    # perth (the Chatterbox watermarker) still imports pkg_resources, which setuptools 81 removed.
    "setuptools>=68,<81",
]

[tool.uv]
package = false
