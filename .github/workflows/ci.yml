name: ci

on:
  push:
  pull_request:

jobs:
  python:
    name: Server parses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Byte-compile the server and its entry points
        run: |
          python -m py_compile server/app.py
          python - <<'PY'
          import ast, pathlib
          for path in pathlib.Path("server").glob("*.py"):
              ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              print("ok", path)
          PY

  scripts:
    name: PowerShell parses
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse every PowerShell script
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object { Write-Error ("{0}: {1}" -f $_.Extent.File, $_.Message) }
            }
          }
          if ($failed) { exit 1 }
